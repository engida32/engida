name: Deploy portfolio

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:prod
      - run: npm run test:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-site
          path: out
          retention-days: 1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portfolio-site
          path: out
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify GitHub Pages backup
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deploy.mjs "$DEPLOY_URL"
      - name: Mirror to WebDAV
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: node scripts/deploy-webdav.mjs
      - name: Upload .htaccess via FTPS
        env:
          FTP_URL: ${{ vars.FTP_URL }}
          FTP_USER: ${{ secrets.WEBDAV_USER }}
          FTP_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          if [ -z "$FTP_URL" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "FTP_URL, WEBDAV_USER, and WEBDAV_PASSWORD must be configured" >&2
            exit 1
          fi
          NETRC="$(mktemp)"
          trap 'rm -f "$NETRC"' EXIT
          node -e 'const fs=require("fs"); const u=new URL(process.env.FTP_URL); fs.writeFileSync(process.argv[1], `machine ${u.hostname}\nlogin ${process.env.FTP_USER}\npassword ${process.env.FTP_PASSWORD}\n`, {mode:0o600});' "$NETRC"
          curl --fail --silent --show-error --netrc-file "$NETRC" --ssl-reqd --ftp-pasv --retry 3 --retry-delay 2 -T deploy/webdav/.htaccess "${FTP_URL%/}/.htaccess"
      - name: Verify primary domain
        run: node scripts/verify-deploy.mjs "https://engida.devs.et"
